architectury {
    common rootProject.enabled_platforms.split(',')
}

loom {
    accessWidenerPath = file("src/main/resources/useful_ribbits.accesswidener")
}

dependencies {
    // Fabric Loader is present here only for the @Environment annotations, which get
    // remapped to the correct annotations on each platform. Do NOT use other classes from it.
    implementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    implementation "com.geckolib:geckolib-common-$rootProject.mc_version:$rootProject.geckolib_version"
}

processResources {
    // pack.mcmeta is templated (${pack_format_number}). Expanding it here fixes the copy that the
    // shadowBundle pulls into every loader jar and the copy on the dev-run classpath. Scoped to the
    // single file so no asset/data JSON containing a literal '$' is touched.
    def packProps = [pack_format_number: rootProject.pack_format_number]
    inputs.properties(packProps)
    filesMatching('pack.mcmeta') { expand packProps }
}
