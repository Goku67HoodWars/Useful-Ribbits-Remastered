name: Publish CurseForge Release

# Manual-only for now (run from the Actions tab). Switch to `release: { types: [published] }`
# once the CurseForge project id + CURSEFORGE_TOKEN secret are set, to auto-publish on release.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Build
        env:
          GITHUB_TAG: ${{ github.event.release.tag_name }}
        run: sh ./gradlew build

      - name: Publish to CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          # TODO: set to the numeric Useful Ribbits CurseForge project id before the first release.
          curseforge-id: 0
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          github-token: ${{ secrets.GITHUB_TOKEN }}

          files: |
            fabric/build/libs/!(*-@(dev|sources|javadoc|javadocs)).jar
            forge/build/libs/!(*-@(dev|sources|javadoc|javadocs)).jar
            neoforge/build/libs/!(*-@(dev|sources|javadoc|javadocs)).jar
          name: ${{ github.event.release.name }}
          version: ${{ github.event.release.tag_name }}
          version-type: release
          changelog: ${{ github.event.release.body }}

          loaders: |
            fabric
            forge
            neoforge
          game-versions: |
            26.2
          java: 25

          # GeckoLib is the only runtime dependency.
          dependencies: |
            geckolib(required)
