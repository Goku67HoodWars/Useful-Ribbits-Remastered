pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven { url = "https://maven.fabricmc.net/" }
        maven { url = "https://maven.architectury.dev/" }
        maven { url = "https://maven.minecraftforge.net/" }
        maven { url = "https://maven.neoforged.net/releases" }
    }
}

plugins {
    // Auto-provisions the Java 25 toolchain when it is not already installed locally.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'useful_ribbits'

include 'common'
include 'fabric'
include 'forge'
include 'neoforge'
