# Gradle
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=false

# Project
version=1.0.0
maven_group=me.rogue_one.useful_ribbits
archives_name=useful_ribbits
java_version=25
enabled_platforms=fabric,forge,neoforge

# Metadata (original author rogue_one / Rogue_one12 credited; GPL-3.0)
mod_name=UsefulRibbits
mod_full_name=Useful Ribbits
mod_id=useful_ribbits
mod_author=rogue_one
mod_description=Adds job ribbits (chef, miner, farmer) that gather and craft for you.
mod_credits=Original mod by rogue_one (Rogue_one12). Multiloader 26.2 port.
license=GPL-3.0

# Minecraft
mc_version=26.2
minecraft_version=26.2
mc_version_range_fabric=>=26.2 <26.3
mc_version_range_forge=[26.2,26.3)
mc_version_range_neoforge=[26.2,26.3)
# pack.mcmeta format for 26.2 (templated via ${pack_format_number}).
pack_format_number=88

# Loaders (proven 26.2 build)
fabric_loader_version=0.19.5
fabric_version=0.160.0
forge_version=26.2-65.1.3
neoforge_version=26.2.0.87

# Dependencies (only real dep is GeckoLib — Ribbits/YungsApi/cloth were unused compileOnly jars)
geckolib_version=5.5.5
# fabric.mod.json may reference ${geckolib_version_fabric}; kept identical to geckolib_version.
geckolib_version_fabric=5.5.5

# CurseForge Publishing
curseforgegradle_version=1.1.15
compatible_versions=26.2
# PLACEHOLDER — set the real Useful Ribbits CurseForge project id before publishing.
# Left 0 on purpose so a stray publish fails loudly instead of uploading to someone else's project.
curseforge_project_id=0
debug_publish=false
# Overwritten by global gradle.properties.
curseforgeApiKey=""
